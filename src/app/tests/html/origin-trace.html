<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Origin Trace Testbed</title>
</head>
<body>
  <h1>Origin Trace Testbed</h1>
  <button id="buy">buy</button>

  <script>
    // Minimal fake framework: the DOM listener is a generic dispatcher and the
    // user-land handler lives in a React-like props key, so BDHS has to go
    // through its handler-detection heuristic, as in a real SPA.

    const orderId = Number(new URLSearchParams(location.search).get("id") || 21);

    function createToken(id) {
      // Built at runtime, so the value never appears as a literal in the source
      return ["wb", "origin", "trace", String(id * 2)].join("-");
    }

    function handleBuy(e) {
      const order = { id: orderId };
      order.token = createToken(order.id);
      window.lastOrder = order;
    }

    function dispatchToHandler(e) {
      const props = e.currentTarget.__reactProps$wbtest;
      if (props && props.onClick) {
        props.onClick(e);
      }
      return true;
    }

    const btn = document.getElementById("buy");
    btn.__reactProps$wbtest = { onClick: handleBuy };
    btn.addEventListener("click", dispatchToHandler);

    // Hover-driven value, created in a timer task (not in a click handler):
    // traced by arming BDHS on a breakpoint. Appended at the end so the lines
    // above keep their numbers.
    function loadPreview() {
      const preview = { id: orderId + 500 };
      preview.token = createToken(preview.id);
      window.lastPreview = preview;
    }

    function renderPreview() {
      return window.lastPreview.id;
    }

    const previewEl = document.createElement("div");
    previewEl.id = "preview";
    previewEl.textContent = "preview";
    document.body.appendChild(previewEl);
    previewEl.addEventListener("mouseover", () => {
      setTimeout(() => {
        loadPreview();
        renderPreview();
      }, 50);
    });

    // Async click handler: the token first shows up in handleAsyncBuy, then the
    // handler awaits again, so the scan pauses in handleAsyncBuy once more after
    // the first match. Frames are listed once per function: the first match
    // must still be flagged.
    async function signPart(id) {
      await new Promise(r => setTimeout(r, 10));
      return String(id * 3);
    }

    async function createAsyncToken(id) {
      const part = await signPart(id);
      return ["wb", "async", "trace", part].join("-");
    }

    async function persistOrder(order) {
      await new Promise(r => setTimeout(r, 10));
      window.lastAsyncOrder = order;
    }

    async function handleAsyncBuy(e) {
      const order = { id: orderId + 900 };
      order.token = await createAsyncToken(order.id);
      await persistOrder(order);
      return order.id;
    }

    const asyncBtn = document.createElement("button");
    asyncBtn.id = "buyAsync";
    asyncBtn.textContent = "buy async";
    asyncBtn.__reactProps$wbtest = { onClick: handleAsyncBuy };
    asyncBtn.addEventListener("click", dispatchToHandler);
    document.body.appendChild(asyncBtn);
  </script>
</body>
</html>
